name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run lint

      - name: Verify rules snapshots are sealed
        run: npm run oracle:seal:check

      - name: Unit tests
        run: npm run test:unit

      - name: Run tests and linting
        run: npm run test:ci

      # The product's core journeys — the Oracle verdict above all — were only
      # ever covered by a suite nothing ran. `@live` specs are excluded: they
      # reach third-party hosts and must not gate a pull request.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:ci

      - name: Build application
        run: npm run build
