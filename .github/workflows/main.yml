name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run lint

      - name: Verify rules snapshots are sealed
        run: npm run oracle:seal:check

      - name: Unit tests
        run: npm run test:unit

      - name: Run tests and linting
        run: npm run test:ci

      - name: Build application
        run: npm run build
